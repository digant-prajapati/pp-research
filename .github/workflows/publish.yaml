name: publish
on: push
permissions:
  id-token: write
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Is the OIDC-issued credential scope enforced?
        run: |
          set -u
          ORG=dg-sec-lab
          TOK=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=private-packagist-trusted-publishing:$ORG" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          curl -sS -X POST -H "Authorization: Bearer $TOK" \
            "https://packagist.com/api/oidc/token-exchange/$ORG/dgseclab%2Fvcs-one" -o /tmp/cred.json
          python3 -c "import json;d=json.load(open('/tmp/cred.json'));print('exchange_ok:',bool(d.get('key') and d.get('secret')))"
          python3 probe/scope_probe.py
